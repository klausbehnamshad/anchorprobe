[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorprobe"
version = "0.1.0"
description = "Stable Text Anchor profile, drift forensics and conformance probes for character-offset annotation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Klaus Behnam Shad" }]
keywords = ["web-annotation", "rfc5147", "cts", "unicode", "normalization", "digital-humanities", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
  "Topic :: Scientific/Engineering",
]
dependencies = ["regex>=2024.4.16"]

[project.optional-dependencies]
probe = ["httpx>=0.27"]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27", "jsonschema>=4.20"]

[project.scripts]
anchorprobe = "anchorprobe.cli:main"

[project.urls]
Repository = "https://github.com/klausbehnamshad/anchorprobe"
Specification = "https://github.com/klausbehnamshad/anchorprobe/blob/main/spec/STABLE-TEXT-ANCHOR.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
